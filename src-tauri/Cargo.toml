[package]
name = "famrev-ai-desktop"
version = "1.0.0"
description = "FAMREV AI Desktop"
authors = ["FAMREV"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.8", features = [] }

[dependencies]
tauri = { version = "1.8", features = ["shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
