name: Build FAMREV AI Desktop (Windows)

# Two installers per run: FAMREV AI (chat.famrev.ai) and FAMREV AI UAT (uat.famrev.ai, for QA; installs side by side).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - flavor: production
            url: https://chat.famrev.ai
            config: ''
          - flavor: uat
            url: https://uat.famrev.ai
            config: '--config src-tauri/tauri.uat.conf.json'
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri CLI
        run: npm install
      - name: Build (${{ matrix.flavor }})
        env:
          FAMREV_URL: ${{ matrix.url }}
        run: npx tauri build ${{ matrix.config }}
      - name: Smoke test (the app starts, makes both windows and keeps running)
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA 'FAMREV\desktop.log'
          Remove-Item $log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath 'src-tauri\target\release\famrev-ai-desktop.exe' -PassThru
          Start-Sleep -Seconds 25
          if (Test-Path $log) { Get-Content $log } else { Write-Host 'no log written' }
          if ($p.HasExited) { Write-Error "FAMREV AI closed by itself after starting (exit code $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern ' started ' -Quiet)) { Write-Error 'the app did not finish starting'; exit 1 }
          if (Select-String -Path $log -Pattern 'crash:|not created' -Quiet) { Write-Error 'a window or the tray icon could not be made (see the log above)'; exit 1 }
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: famrev-ai-windows-${{ matrix.flavor }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
